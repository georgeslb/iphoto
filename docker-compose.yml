# iphoto - production deployment
#
# Pulls the app image built/pushed by .github/workflows/docker-image.yml
# (ghcr.io/georgeslb/iphoto) and a real Postgres server (not the H2 used by the test suite - see
# AbstractIntegrationTest for that side). Copy .env.example to .env and fill it in before running
# this; every credential below is read from there, nothing is hardcoded.
#
# Usage:
#   cp .env.example .env        # edit passwords/domain first
#   docker compose pull
#   docker compose up -d
#
# The ghcr.io/georgeslb/iphoto package is private (see docker-image.yml's own comment) - on a
# fresh host, `docker login ghcr.io` with a GitHub PAT that has `read:packages` scope before
# `docker compose pull` will otherwise fail with "unauthorized".
#
# Immich migration credentials (specification.md) are NOT here - they're a per-user setting stored
# in the database (UserEntity.immichBaseUrl/immichApiKeyEncrypted), configured from within the app
# itself, not deployment-time config.

services:
  iphoto-db:
    container_name: iphoto-db
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: iphoto
      POSTGRES_USER: iphoto
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      # Bind mount, not a Docker-managed named volume - lives at a known host path
      # (/data/iphoto/postgres) instead of under /var/lib/docker/volumes, so it survives being
      # found/backed up/inspected independently of Docker. Must be owned by whatever UID the
      # postgres:16-alpine image's postgres user actually is (`docker run --rm postgres:16-alpine
      # id postgres`) or the container will fail to start.
      - /data/iphoto/postgres:/var/lib/postgresql/data
    # Not published to the host on purpose - only iphoto-app talks to this, over the
    # compose-internal network. Uncomment to reach it directly (e.g. psql/pgAdmin from the host).
    # ports:
    #   - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iphoto -d iphoto"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    shm_size: 256mb # Postgres uses shared memory for parallel query workers/large sorts - the
    # Docker default (64MB) is a common source of "could not resize shared memory segment" errors
    # under real load; harmless to raise even if this app never hits it.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  iphoto-app:
    container_name: iphoto-app
    image: ghcr.io/georgeslb/iphoto:${IPHOTO_TAG:-latest}
    restart: unless-stopped
    # Hard cap on the container's RSS. Without it the JVM's ergonomics see the whole host (a WSL2
    # VM with ~29GB in qualif) and size MaxHeapSize at MaxRAMPercentage=25% of that = ~7.3GB - G1
    # then commits that entire heap under load and never uncommits it, which is most of the ~15GB
    # RSS that was observed (the rest is metaspace/code cache + the OpenCV/FFmpeg/ONNX/DJL native
    # libs). -Xmx below is the real control; this limit is the backstop and the value
    # MaxRAMPercentage is measured against. Raise both together if the working set grows.
    mem_limit: 5g
    depends_on:
      iphoto-db:
        condition: service_healthy
    # `default` (this project's own compose-internal network, auto-created - needed to reach
    # iphoto-db) plus `nginx` (an existing EXTERNAL network, shared with whatever else already
    # runs on it - e.g. Immich, a reverse proxy - so iphoto-app can reach those by container/
    # service name too). Listing `default` explicitly here is required, not just for clarity -
    # once a service declares ANY `networks:` of its own, Compose stops auto-attaching it to
    # `default`; without this line iphoto-app would lose its connection to iphoto-db entirely.
    networks:
      - default
      - nginx
    environment:
      # Spring Boot's relaxed env-var binding (SPRING_DATASOURCE_URL -> spring.datasource.url,
      # etc.) - see application.yml for the property names/defaults these override.
      SPRING_DATASOURCE_URL: jdbc:postgresql://iphoto-db:5432/iphoto
      SPRING_DATASOURCE_USERNAME: iphoto
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      IPHOTO_STORAGE_BASE: /data/iphoto
      # No IPHOTO_ADMIN_USERNAME here on purpose - the admin username is fixed ("admin", see
      # application.yml's admin.username) and not meant to be changed post-deployment; only the
      # password is deployment config (IPhotoApplication#initDatabase reconciles it on every boot,
      # not just the account's first-ever creation).
      IPHOTO_ADMIN_PASSWORD: ${IPHOTO_ADMIN_PASSWORD:?set IPHOTO_ADMIN_PASSWORD in .env}
      # Signs the "remember me" persistent-login cookie (SecurityConfig/SecurityProperties) -
      # required, same reasoning as IPHOTO_ADMIN_PASSWORD above: the application.yml default is a
      # known, local-dev-only value, and anyone who knows it can forge a valid remember-me cookie
      # for any username.
      IPHOTO_REMEMBER_ME_KEY: ${IPHOTO_REMEMBER_ME_KEY:?set IPHOTO_REMEMBER_ME_KEY in .env}
      # Overrides application.yml's local-dev-relative "logs/" default (see its own comment) - a
      # path under the dedicated /data/iphoto/logs bind mount below instead, so rotated log files
      # survive a container recreate/redeploy. A separate host directory from /data/iphoto/data on
      # purpose: logs are pruned by application.yml's own rolling policy (30 days / 500MB total), a
      # very different retention need than photo originals, which this app never deletes on its own.
      LOGGING_FILE_NAME: /data/iphoto-logs/iphoto.log
      # Heap sizing + GC tuning, picked after finding the container at ~15GB RSS with only ~2.5GB
      # of live heap (the rest was uncollected young-gen garbage sitting in an over-sized,
      # fully-committed 7.3GB G1 heap - see mem_limit's comment above).
      #   -Xmx3g / -Xms1g          explicit heap ceiling instead of the 25%-of-host ergonomic;
      #                            live set is ~2.5GB, 3g leaves headroom for spikes.
      #   G1PeriodicGCInterval     let G1 run a collection (and uncommit freed regions) during
      #                            idle periods, not only under allocation pressure - this is what
      #                            actually returns memory to the OS between bursts of work.
      #   MaxRAMPercentage=60      only relevant as a fallback, bounded by mem_limit (5g) not the
      #                            host, so it can never re-inflate past ~3g anyway.
      #   NativeMemoryTracking     so `jcmd <pid> VM.native_memory summary` works after a restart
      #                            (it can only be enabled at JVM start) - keep until the off-heap
      #                            side is fully characterised, then drop it (small native cost).
      JAVA_TOOL_OPTIONS: >-
        -Xms1g -Xmx3g
        -XX:MaxRAMPercentage=60
        -XX:G1PeriodicGCInterval=300000
        -XX:NativeMemoryTracking=summary
    volumes:
      # Bind mounts to known host paths under /data/iphoto, not Docker-managed named volumes - see
      # iphoto-db's own volumes comment above for why.
      - /data/iphoto/data:/data/iphoto
      - /data/iphoto/logs:/data/iphoto-logs
    ports:
      - "${IPHOTO_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Nightly (02:00 container-local time, see nas-backup/crontab) sync of /data/iphoto/data and a
  # pg_dump of iphoto-db to a Synology NAS on the LAN, over rsync-over-SSH. Entirely optional -
  # `docker compose up -d` still works with no NAS configured, this service just won't have the
  # NAS_* variables it needs and will fail its own validation instead of the rest of the stack.
  # See nas-backup/README.md for one-time SSH key setup on the NAS side.
  iphoto-nas-backup:
    container_name: iphoto-nas-backup
    build: ./nas-backup
    restart: unless-stopped
    # entrypoint.sh execs crond as PID 1 - a process that's PID 1 is automatically its own
    # session leader, and POSIX forbids a session leader from calling setpgid() on itself, which
    # crond does internally for job control ("setpgid: Operation not permitted" at startup).
    # init: true makes Docker run its own tiny init (tini, bundled with the engine) as PID 1
    # instead, with crond as its child - sidesteps the restriction entirely, no Dockerfile change
    # needed.
    init: true
    depends_on:
      iphoto-db:
        condition: service_healthy
    environment:
      PGHOST: iphoto-db
      PGPORT: 5432
      PGDATABASE: iphoto
      PGUSER: iphoto
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      NAS_HOST: ${NAS_HOST:?set NAS_HOST in .env}
      NAS_SSH_PORT: ${NAS_SSH_PORT:-22}
      NAS_USER: ${NAS_USER:?set NAS_USER in .env}
      NAS_ASSETS_PATH: ${NAS_ASSETS_PATH:-/volume1/iphoto-backup/assets}
      NAS_DB_DUMPS_PATH: ${NAS_DB_DUMPS_PATH:-/volume1/iphoto-backup/db-dumps}
      NAS_REPORTS_PATH: ${NAS_REPORTS_PATH:-/volume1/iphoto-backup/reports}
      DB_DUMP_RETENTION_DAYS: ${DB_DUMP_RETENTION_DAYS:-30}
      TZ: ${BACKUP_TZ:-UTC}
    volumes:
      # Same host path iphoto-app writes originals/thumbnails into, bind-mounted read-only here -
      # this container only ever reads from it to sync to the NAS, it never writes back.
      - /data/iphoto/data:/data/iphoto:ro
      - /data/iphoto/dumps:/backup/db-dumps
      - /data/iphoto/reports:/backup/reports
      # Private key for NAS_USER on the Synology, generated once on the host (see
      # nas-backup/README.md) - never baked into the image or committed to the repo.
      - ${NAS_SSH_KEY_HOST_PATH:-./nas-backup/secrets/id_ed25519}:/run/secrets/nas_ssh_key:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  # Pre-existing network, not owned by this compose file - shared with whatever else already runs
  # on it (reverse proxy, Immich, ...) so containers can reach each other by name for things like
  # the per-user Immich import feature (see UserEntity.immichBaseUrl/specification.md). `external:
  # true` means "attach to this, don't try to create it"; omit/misname it and `docker compose up`
  # fails fast with "network nginx declared as external, but could not be found" rather than
  # silently creating a same-named one of its own.
  nginx:
    external: true
