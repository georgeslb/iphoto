spring:
  application:
    name: iphoto
  
  datasource:
    url: jdbc:postgresql://localhost:5432/iphoto
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 20000 #maximum number of milliseconds that a client will wait for a connection
      minimum-idle: 10 #minimum number of idle connections maintained by HikariCP in a connection pool
      maximum-pool-size: 100 #limite le nombre total de connexions simultanées que ce pool conservera.les valeurs de ce paramètre sont très variables en fonction de la conception, de l'infrastructure et de la base de données
      idle-timeout: 10000 #maximum idle time for connection
      max-lifetime: 1000 # maximum lifetime in milliseconds of a connection in the pool after it is closed.

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  servlet:
    multipart:
      max-file-size: 2GB
      max-request-size: 2GB



  mvc:
    favicon:
      enabled: false

iphoto:
  storage:
    photos: D:\temp\storage\originals
    thumbnails: D:\temp\storage\thumbnails
    temp: D:\temp\storage\temp
    chunks: D:\temp\storage\chunks


server:
  servlet:
    session:
      timeout: 30m