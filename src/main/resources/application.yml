spring:
  application:
    name: iphoto
  
  datasource:
    url: jdbc:postgresql://localhost:5432/iphoto
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  servlet:
    multipart:
      max-file-size: 2GB
      max-request-size: 2GB


  mvc:
    favicon:
      enabled: false

iphoto:
  storage:
    photos: D:\temp\storage\originals
    thumbnails: D:\temp\storage\thumbnails
    temp: D:\temp\storage\temp

