spring:
  application:
    name: iphoto
  
  datasource:
    url: jdbc:postgresql://localhost:5432/iphoto
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 20000 #maximum number of milliseconds that a client will wait for a connection
      minimum-idle: 10 #minimum number of idle connections maintained by HikariCP in a connection pool
      maximum-pool-size: 100 #limite le nombre total de connexions simultanées que ce pool conservera.les valeurs de ce paramètre sont très variables en fonction de la conception, de l'infrastructure et de la base de données
      idle-timeout: 10000 #maximum idle time for connection
      max-lifetime: 1000 # maximum lifetime in milliseconds of a connection in the pool after it est closed.

  jpa:
    hibernate:
      # Schema is now owned by Flyway (src/main/resources/db/migration) - validate just checks the
      # entity mappings still agree with whatever Flyway built, it never issues DDL of its own.
      # Replaces the old ddl-auto=update. Flyway itself needs no config here - defaults
      # (spring.flyway.enabled=true, locations=classpath:db/migration) are exactly right, and
      # V1__baseline_schema.sql assumes a fresh database, not a migration off an existing one.
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
      jdbc:
        batch_size: 30

  servlet:
    multipart:
      max-file-size: 2GB
      max-request-size: 2GB



  mvc:
    favicon:
      enabled: false

# File logging with rotation, alongside the console output Spring Boot already gives you for
# free (setting logging.file.name doesn't replace the console appender, it adds a file one next
# to it - both stay active). Local-dev default is a relative "logs/" dir (gitignored) so this
# works out of the box with zero setup; docker-compose.yml overrides LOGGING_FILE_NAME to a path
# under a dedicated mounted volume, so container logs survive a redeploy/recreate instead of being
# lost with the container (Docker's own json-file driver, still configured in docker-compose.yml
# too, only ever captured stdout for `docker compose logs` - nothing was ever written to disk in a
# way that outlived the container itself).
logging:
  file:
    name: logs/iphoto.log
  logback:
    rollingpolicy:
      # Rotates on WHICHEVER of size/day comes first (Spring Boot's default SizeAndTimeBasedRollingPolicy
      # behavior once both are set) - a busy day doesn't have to wait for midnight to roll over.
      max-file-size: 10MB
      # Days of rotated files to keep, not a raw file count - a quiet day's single small file and a
      # busy day's several 10MB ones both just count as "one day" here.
      max-history: 30
      # Hard ceiling regardless of max-history, in case max-history alone would let disk usage grow
      # unbounded on an unusually heavy stretch - oldest rotated files are pruned first once hit.
      total-size-cap: 500MB
      # Rotated files are already gzip-compressed by Spring Boot's default file-name-pattern
      # (iphoto.log.<date>.<index>.gz) - no separate compression setting needed.
      clean-history-on-start: true

iphoto:
  storage:
    base: /home/georges/data/iphoto/storage
    photos: ${iphoto.storage.base}/originals
    thumbnails: ${iphoto.storage.base}/thumbnails
    temp: ${iphoto.storage.base}/temp
    chunks: ${iphoto.storage.base}/chunks
    immich-temp: ${iphoto.storage.base}/immich-temp
  admin:
    username: admin
    password: admin
    role: ADMIN
  security:
    # Signs the "remember me" persistent-login cookie (SecurityConfig) - a local-dev-only default,
    # MUST be overridden to a real secret in production (IPHOTO_REMEMBER_ME_KEY, same
    # required-override pattern as admin.password/IPHOTO_ADMIN_PASSWORD - see
    # docker-compose.yml/.env.example). Anyone who knows this value can forge a valid remember-me
    # cookie for any username.
    remember-me-key: dev-only-remember-me-key-change-in-production
  memories:
    # Library's "on this day" bar - one candidate window per offset. Plain integer = exact day
    # only; append -Nd/+Nd (either order) to widen the search N days earlier/later, e.g.
    # "6-2d+3d" looks 6 months back, tolerating 2 days earlier through 3 days later. Defaults kept
    # exact (no tolerance), matching prior behavior - add tolerance to individual entries as wanted.
    offsets: [1-1d+1d, 6-3d+3d, 12-7d+7d, 36-20d+20d, 60-40d+40d, 120-40d+40d]
    photos-per-block: 5 # up to this many random photos auto-cycled per offset
  heavy-tasks:
    # Each gets its own dedicated pool (see ThreadPoolConfiguration/TaskWorkerManager) - not a
    # shared heavy pool any more. duplication-threads/face-recognition-threads stay at 1: both
    # services process a whole overlapping data set per run (candidate duplicate groups / all
    # users' ungrouped faces) and aren't safe to run concurrently with themselves.
    # face-detection-threads can go higher since each call uses its own DJL Predictor instance.
    duplication-threads: 1
    middleTaskThreads: 10
    face-recognition-threads: 1
    queue-capacity: 30

# Actuator - kept on the same port as everything else (no management.server.port override) so
# SecurityConfig's normal filter chain actually covers it; a separate management port runs its own
# embedded server context that Spring Security's servlet filter chain never sees, which would leave
# these endpoints (threaddump, heapdump, env, ...) completely unauthenticated. See SecurityConfig's
# own "/actuator/**" -> hasRole("ADMIN") rule, the same pattern already used for "/api/admin/**".
# Deliberately a narrow allow-list (not "*"): threaddump/heapdump/loggers/metrics/health/info cover
# everything an incident actually needs (see TODO.md's 2026-09-12 production-incident entry - this
# whole thing exists because diagnosing that hang required manual jhsdb/ptrace gymnastics instead of
# one curl call) without exposing endpoints like env/beans/configprops that dump more internal
# detail (secrets included, if ever misconfigured) than an admin curling this during an incident
# needs.
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,threaddump,heapdump,loggers
  endpoint:
    health:
      show-details: always

server:
  port: 8080
  # docker-compose.yml runs this app behind an external nginx reverse proxy (upload.attieh.uk) -
  # without this, Spring/Tomcat has no idea the original request was HTTPS on the real hostname
  # (it only sees plain HTTP from nginx on the compose-internal network) and builds any
  # scheme/host-dependent value (redirect Location headers, request.isSecure()) off that wrong
  # view instead of nginx's X-Forwarded-Proto/-Host/-For headers. "framework" delegates the
  # translation to Spring's own ForwardedHeaderFilter (recommended over "native"'s
  # Tomcat-Valve-based approach for a Spring Security app - runs as a normal filter, ahead of the
  # security filter chain, which is what "native" bypasses). Not the fix for the reported
  # guest-share-session issue by itself (verified via ShareFlowIntegrationTest that session
  # establishment/ShareAccessFilter/guest endpoints all work correctly end-to-end already) - this
  # is a real, separate gap in reverse-proxy correctness worth closing regardless.
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 30m