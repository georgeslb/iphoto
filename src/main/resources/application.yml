spring:
  application:
    name: iphoto
  
  datasource:
    url: jdbc:postgresql://localhost:5432/iphoto
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 20000 #maximum number of milliseconds that a client will wait for a connection
      minimum-idle: 10 #minimum number of idle connections maintained by HikariCP in a connection pool
      maximum-pool-size: 100 #limite le nombre total de connexions simultanées que ce pool conservera.les valeurs de ce paramètre sont très variables en fonction de la conception, de l'infrastructure et de la base de données
      idle-timeout: 10000 #maximum idle time for connection
      max-lifetime: 1000 # maximum lifetime in milliseconds of a connection in the pool after it est closed.

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  servlet:
    multipart:
      max-file-size: 2GB
      max-request-size: 2GB



  mvc:
    favicon:
      enabled: false

iphoto:
  storage:
    base: /home/georges/data/iphoto/storage
    photos: ${iphoto.storage.base}/originals
    thumbnails: ${iphoto.storage.base}/thumbnails
    temp: ${iphoto.storage.base}/temp
    chunks: ${iphoto.storage.base}/chunks
    immich-temp: ${iphoto.storage.base}/immich-temp
  admin:
    username: admin
    password: admin
    role: ADMIN
  memories:
    months-ago: [1, 6, 12, 36, 60, 120] # Library's "on this day" bar - one candidate per offset
    photos-per-block: 5 # up to this many random photos auto-cycled per offset

server:
  port: 8080
  servlet:
    session:
      timeout: 30m