name: Docker image

on:
  push:
    branches:
      - master
      - main
    tags:
      - '*'
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional custom version tag (e.g. v1.0.1 or 1.0.1)'
        required: false
        default: ''

env:
  REGISTRY: ghcr.io

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # lfs: true deliberately omitted here - src/main/resources/models/*.onnx are git-lfs
      # tracked (.gitattributes), and without it this checkout gets their ~130-byte pointer files
      # instead of real ONNX content. FaceDetectionConfiguration is @Profile("!test") and never
      # created under the "test" profile, so integration tests never touch them.
      - uses: actions/checkout@v5

      # Matches pom.xml's maven-compiler-plugin release (25)
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # javacv's opencv-platform/ffmpeg-platform native .so files runtime dependencies
      - name: Install OpenCV/FFmpeg native runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgomp1 libsm6 libxext6 libxrender1 \
            libgtk2.0-0t64 libcairo2 libgdk-pixbuf-2.0-0 libopenblas0 \
            libva2 libva-drm2 libasound2t64 libpulse0

      # The backend's integration tests (src/test/java) spin up a real Postgres via Testcontainers
      - name: Run backend tests
        run: mvn -B test

      # Node.js 22 LTS (provides util.styleText needed by Vitest / Rolldown)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run frontend tests
        working-directory: src/main/resources/static
        run: |
          npm ci
          npm test

  build-and-push:
    needs: test
    # Run on:
    # 1) Any tag push (e.g. manually positioned tag on master)
    # 2) Push / merge into master or main branch
    # 3) Manual workflow_dispatch
    if: >
      startsWith(github.ref, 'refs/tags/') ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR requires a lowercase image name
      - name: Compute lowercase image name
        id: image
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Determine version
        id: version
        run: |
          # 1. If triggered by a tag push (manual tag positioning)
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG_RAW="${GITHUB_REF#refs/tags/}"
            echo "mode=tag" >> "$GITHUB_OUTPUT"
            echo "tag=${TAG_RAW}" >> "$GITHUB_OUTPUT"
            CLEAN_VERSION="${TAG_RAW#v}"
            echo "version=${CLEAN_VERSION}" >> "$GITHUB_OUTPUT"
            echo "is_manual_tag=true" >> "$GITHUB_OUTPUT"
          # 2. If triggered by manual workflow_dispatch with a custom version input
          elif [ -n "${{ github.event.inputs.version }}" ]; then
            INPUT_VER="${{ github.event.inputs.version }}"
            CLEAN_VERSION="${INPUT_VER#v}"
            echo "mode=input" >> "$GITHUB_OUTPUT"
            echo "tag=v${CLEAN_VERSION}" >> "$GITHUB_OUTPUT"
            echo "version=${CLEAN_VERSION}" >> "$GITHUB_OUTPUT"
            echo "is_manual_tag=false" >> "$GITHUB_OUTPUT"
          # 3. Otherwise (merge / push to master/main): compute version automatically
          else
            BASE_VERSION=$(sed -n 's/.*<version>\(.*\)<\/version>.*/\1/p' pom.xml | head -n 2 | tail -n 1)
            BASE_VERSION="${BASE_VERSION:-1.0.0}"
            CLEAN_BASE="${BASE_VERSION%-SNAPSHOT}"
            VERSION="${CLEAN_BASE}.${{ github.run_number }}"
            echo "mode=auto" >> "$GITHUB_OUTPUT"
            echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "is_manual_tag=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=${{ steps.version.outputs.tag }}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # When automatically merged into master/main (not a manual tag push), create the git tag and GitHub Release automatically
      - name: Create Git tag and GitHub Release
        if: steps.version.outputs.is_manual_tag == 'false' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ steps.version.outputs.tag }}"
          echo "Creating automated release and tag $TAG_NAME"
          gh release create "$TAG_NAME" \
            --title "Release $TAG_NAME" \
            --generate-notes

      # If manually triggered via a tag push, create or update the GitHub Release for that tag if not already present
      - name: Publish GitHub Release for manual tag
        if: steps.version.outputs.is_manual_tag == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ steps.version.outputs.tag }}"
          echo "Publishing release for manual tag $TAG_NAME"
          gh release create "$TAG_NAME" \
            --title "Release $TAG_NAME" \
            --generate-notes || true
