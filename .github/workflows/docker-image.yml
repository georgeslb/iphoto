name: Docker image

# Runs the backend test suite on every branch push (feature branches and master alike) - this is
# what a required status check on the PR's merge button gates on. Building and pushing the Docker
# image to GitHub Container Registry (ghcr.io) never happens automatically (not even on a push to
# master) - it only runs from a manual "Run workflow" dispatch, since there's no way to build/push
# the image outside CI here.
on:
  push:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # lfs: true deliberately omitted here - src/main/resources/models/*.onnx are git-lfs
      # tracked (.gitattributes), and without it this checkout gets their ~130-byte pointer files
      # instead of real ONNX content. That's fine for this job specifically: FaceDetectionConfiguration
      # (the only thing that loads them) is @Profile("!test") and never created under the "test"
      # profile AbstractIntegrationTest activates, so the test suite genuinely never touches them
      # (verified by running it with both files removed entirely - see TODO.md). Skipping the LFS
      # pull here avoids spending bandwidth against GitHub's small free LFS quota on every push for
      # files this job doesn't need - build-and-push below is where they actually matter.
      - uses: actions/checkout@v5

      # Matches pom.xml's maven-compiler-plugin release (25) - not the project's
      # <java.version>21</java.version> property, which is a separate, older setting; see the
      # Dockerfile's top comment for the same note.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # javacv's opencv-platform/ffmpeg-platform native .so files dlopen a handful of system
      # libraries at load time (not just when their functionality is actually used - e.g.
      # libopencv_highgui links GTK2 even though this app never opens a GUI window). The
      # Dockerfile's runtime stage already documents the exact list, found by running `ldd`
      # against every linux-x86_64 .so in these exact opencv/ffmpeg artifact versions - mirror it
      # here rather than re-deriving it, since this runner and that image are both recent Ubuntu.
      # Without this, any test that synchronously calls into ORB/highgui-adjacent OpenCV code
      # fails with "UnsatisfiedLinkError: no jniopencv_highgui in java.library.path" - previously
      # never caught here because the only code path that touched it (DuplicationServiceImpl,
      # reached via async background task processing in every other test) silently swallowed the
      # failure instead of failing a test.
      - name: Install OpenCV/FFmpeg native runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgomp1 libsm6 libxext6 libxrender1 \
            libgtk2.0-0t64 libcairo2 libgdk-pixbuf-2.0-0 libopenblas0 \
            libva2 libva-drm2 libasound2t64 libpulse0

      # The backend's integration tests (src/test/java) spin up a real Postgres via
      # Testcontainers - this needs Docker, which GitHub-hosted ubuntu-latest runners already
      # have available out of the box, no extra setup required.
      - name: Run backend tests
        run: mvn -B test

  build-and-push:
    needs: test
    # Manual only: a workflow_dispatch run builds and pushes the image (after the test job above
    # passes); a pull_request event never reaches this job, so PRs only ever run the test gate.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # lfs: true here (unlike the test job above) - the Dockerfile's build stage COPYs this
      # checkout wholesale and packages whatever's under src/main/resources/models/ straight into
      # the real, production app image, which DOES need working ONNX models at runtime. Without
      # this the image would ship with the ~130-byte git-lfs pointer files instead of real models,
      # and face detection would fail the moment a real request hit it.
      - uses: actions/checkout@v5
        with:
          lfs: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR requires a lowercase image name; github.repository isn't guaranteed to be (GitHub
      # usernames/org names can contain uppercase letters), so lowercase it explicitly rather
      # than assume.
      - name: Compute lowercase image name
        id: image
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A brand-new GHCR package isn't reliably private-by-default just because this workflow
      # uses GITHUB_TOKEN - after the first successful push, check the package's visibility under
      # https://github.com/users/<you>/packages (or the org equivalent) / "Package settings", and
      # set it to Private + link it to this repo if it isn't already.
